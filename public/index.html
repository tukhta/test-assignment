<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Проверка скорости скачивания</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Проверка скорости</h1>
    <p>Введи ссылку на файл. Мы скачаем его 10 раз подряд и измерим скорость.</p>
    <form id="form">
      <label for="url">Ссылка на файл</label>
      <input id="url" type="url" placeholder="https://example.com/image.jpg" required>
      <button id="button" type="submit">Начать проверку</button>
    </form>
    <p id="status" aria-live="polite"></p>
    <section id="result" hidden>
      <h2 id="speed"></h2>
      <p>Среднее время запроса: <strong id="average"></strong></p>
      <p>Всего скачано: <strong id="size"></strong></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
